<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리자격증</title>
<meta name="description" content="오늘 뜬 주제로 민간자격을 찾아 보낼지 결정하는 버튼">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="데일리자격증">
<style>
:root{
  --bg:#f2f1ea; --card:#fffefa; --ink:#23302b; --dim:#79867f; --line:#dfded3;
  --accent:#1f4d42; --gold:#a8762f; --ok:#2f6f5e; --bad:#a4432f;
  /* 강조색 위에 얹는 글자색. 다크에서 강조색이 밝아지므로 함께 뒤집는다 */
  --on-accent:#f7f6ef;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14201c; --card:#1d2a25; --ink:#e6e8e0; --dim:#8d9a92; --line:#2f3d37;
    --accent:#6fae9c; --gold:#d3a15e; --ok:#7fb59c; --bad:#e08a74;
    --on-accent:#122a24;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:460px; margin:0 auto; padding:24px 20px;
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}
header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px}
.brand{font-size:15px; font-weight:700; letter-spacing:.12em; color:var(--dim)}
.icon-btn{background:none; border:0; padding:6px; color:var(--dim); font-size:18px;
  cursor:pointer; line-height:1; border-radius:8px}
.icon-btn:hover{background:var(--line)}

/* 주제 고르기 — 안 고르면 '자동'이 누르는 그 시각의 뉴스로 다시 고른다 */
.picker{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap}
.chip{
  flex:1 1 0; min-width:0; padding:9px 6px; border:1px solid var(--line); border-radius:11px;
  background:var(--card); color:var(--dim); font:inherit; font-size:13px; font-weight:600;
  cursor:pointer; transition:background .12s, color .12s, border-color .12s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}

.card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-bottom:16px}
.badge{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.06em;
  padding:4px 10px; border-radius:999px; background:var(--accent); color:var(--on-accent)}
.badge.flat{background:var(--line); color:var(--dim)}
.auto{margin-left:7px; font-size:11.5px; color:var(--dim); letter-spacing:.04em}
.topic{
  margin:14px 0 0; font-size:30px; line-height:1.25; font-weight:700; letter-spacing:-.02em;
  word-break:keep-all;
}
.count{margin:6px 0 0; font-size:14px; color:var(--dim)}
.count b{color:var(--ink); font-weight:600}
.why{margin:16px 0 0; padding-top:14px; border-top:1px solid var(--line)}
.why p{margin:0 0 7px; font-size:12.5px; line-height:1.5; color:var(--dim); word-break:keep-all}
.why p:last-child{margin-bottom:0}
.why .src{display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.03em;
  color:var(--gold); border:1px solid var(--line); border-radius:5px; padding:0 5px; margin-right:5px}
.peek{margin:14px 0 0; font-size:13px; color:var(--dim); line-height:1.7; word-break:keep-all}
.peek b{color:var(--ink); font-weight:600}

button.go{
  display:block; width:100%; padding:21px; border:0; border-radius:16px;
  background:var(--accent); color:var(--on-accent);
  font:inherit; font-size:18px; font-weight:700; letter-spacing:.02em;
  cursor:pointer; transition:transform .08s, opacity .15s;
}
button.go:active{transform:scale(.985)}
button.go:disabled{opacity:.5; cursor:default; transform:none}

.status{margin:15px 2px 0; font-size:14.5px; min-height:22px; color:var(--dim); word-break:keep-all}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.status a{color:inherit}
.sub{margin:10px 2px 0; font-size:13px; color:var(--dim)}
footer{margin-top:24px; font-size:12.5px; color:var(--dim); line-height:1.8}

/* 보낸 기록 — 한 번 나온 주제는 다시 안 나온다. 그 목록이 이것이다 */
.log-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}
.log-head h2{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em}
.log-head span{font-size:12.5px; color:var(--dim)}
.row{border-top:1px solid var(--line); padding:11px 0}
.row:first-of-type{border-top:0; padding-top:0}
.row button{background:none; border:0; padding:0; width:100%; text-align:left; font:inherit;
  color:inherit; cursor:pointer; display:flex; align-items:baseline; gap:8px}
.row .t{font-weight:600; font-size:15px}
.row .d{font-size:12px; color:var(--dim); margin-left:auto; white-space:nowrap}
.row .certs{margin:8px 0 0; font-size:12.5px; color:var(--dim); line-height:1.7; word-break:keep-all}
.row .certs a{color:var(--gold); text-decoration:none; border-bottom:1px solid var(--line)}

.dots::after{content:"…"; animation:d 1.3s ease-in-out infinite}
@keyframes d{0%,100%{opacity:.25}50%{opacity:1}}

label{display:block; font-size:13px; color:var(--dim); margin:0 0 8px}
input[type=password]{width:100%; padding:14px; font:15px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:12px}
ol{margin:12px 0 0; padding-left:20px; font-size:14px; color:var(--dim)}
ol li{margin:7px 0; word-break:keep-all}
ol b{color:var(--ink)}
code{font:13px ui-monospace,SFMono-Regular,Consolas,monospace; background:var(--bg);
  padding:1px 5px; border-radius:5px; border:1px solid var(--line)}
.skel{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">🎓 데일리자격증</span>
    <button class="icon-btn" id="gear" title="토큰 설정" hidden>⚙</button>
  </header>
  <div id="view"><p class="skel">불러오는 중<span class="dots"></span></p></div>
  <noscript><p>자바스크립트를 켜야 동작합니다.</p></noscript>
</div>

<script>
const OWNER = 'reepower84-png', REPO = 'daily-cert', WORKFLOW = 'send.yml', REF = 'main';
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const KEY = 'dailycert.token';
const 자동 = '자동';
const 상세 = id => `https://www.pqi.or.kr/inf/qul/infQulBasDetail.do?searchQulId=${id}`;

const $ = s => document.querySelector(s);
const view = $('#view'), gear = $('#gear');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 날짜는 전부 한국 시간 기준 — 서버(progress.json)와 같은 잣대여야 '며칠 쉬었는지'가 맞는다
const KST = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'});
const 오늘 = () => KST.format(new Date());
const 요일 = ['일','월','화','수','목','금','토'];
const 날짜 = ymd => {
  const d = new Date(ymd + 'T12:00:00Z');
  return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${요일[d.getUTCDay()]})`;
};
const 며칠전 = ymd => Math.round((new Date(오늘()) - new Date(ymd)) / 86400000);

// 설정 링크(#t=토큰)로 들어오면 그 자리에서 저장하고 주소를 지운다.
// 폰에서 긴 토큰을 손으로 옮겨 적지 않게 하려는 장치다.
// 해시는 서버로 전송되지 않으므로 Pages 로그에는 남지 않는다.
function 설정링크() {
  const m = location.hash.match(/[#&]t=([^&]+)/);
  if (!m) return false;
  try { localStorage.setItem(KEY, decodeURIComponent(m[1])); } catch {}
  history.replaceState(null, '', location.pathname + location.search);
  return true;
}
설정링크();

// 이 페이지를 이미 열어 둔 탭에서 설정 링크를 다시 열면 주소의 '#뒤'만 바뀐다.
// 브라우저는 그걸 같은 문서로 보고 새로고침을 하지 않아서, 위 함수가 다시 돌지 않는다 —
// 토큰을 넣었는데도 토큰 화면이 그대로 떠 있는 것처럼 보인다. 그래서 직접 듣는다.
addEventListener('hashchange', () => { if (설정링크()) location.reload(); });

let token = localStorage.getItem(KEY) || '';
let 예고 = null;          // data/next.json — 보내기 화면이 읽는다
let 물려받음 = '';        // 형제 앱에서 토큰을 집어 왔으면 그 앱 이름
let 진도 = null;          // data/progress.json — 보낸 기록이 읽는다
let 고른주제 = 자동;
let 펼친날 = null;        // 보낸 기록에서 누른 줄 (한 번 더 누르면 닫힌다)

class GhError extends Error {
  constructor(msg, 토큰문제 = false) { super(msg); this.토큰문제 = 토큰문제; }
}

async function gh(path, opts = {}) {
  let res;
  try {
    res = await fetch(API + path, {
      cache: 'no-store',
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + token,
        'X-GitHub-Api-Version': '2022-11-28',
        ...(opts.headers || {}),
      },
    });
  } catch {
    throw new GhError('GitHub에 연결하지 못했습니다. 네트워크를 확인해 주세요.');
  }
  if (res.status === 401) throw new GhError('토큰이 만료됐거나 잘못됐습니다. 새로 발급해 주세요.', true);
  if (res.status === 403) throw new GhError('토큰 권한이 모자랍니다 — Actions를 “Read and write”로 주셔야 합니다.', true);
  if (res.status === 404) throw new GhError('저장소를 찾지 못했습니다. 토큰이 daily-cert 저장소를 포함하는지 확인해 주세요.', true);
  if (!res.ok) throw new GhError(`GitHub 응답 ${res.status} ${res.statusText}`);
  return res;
}
const 읽기 = async path =>
  JSON.parse(await (await gh(`/contents/${path}?ref=${REF}`, {headers:{'Accept':'application/vnd.github.raw'}})).text());

// ── 형제 앱의 토큰 물려받기 ─────────────────────────────
// 데일리 시리즈의 버튼 앱들은 모두 reepower84-png.github.io 한 주소에 얹혀 있다.
// 경로만 다르고 출처(origin)가 같으므로 **localStorage 를 그대로 공유한다** — 키만
// 다르다 (dailybook.token · dailyenglish.token · dailycert.token …).
//
// ⚠️ 이게 왜 필요한가. 데일리북 앱의 토큰은 권한 모양이 여기와 똑같다
//    (Actions = Read and write, Contents = Read-only). 저장소 목록에 daily-cert 를
//    더하기만 하면 여기서도 그대로 먹고, 파인그레인드 PAT 은 목록을 고쳐도 **토큰
//    문자열이 바뀌지 않는다.** 그런데 그 문자열은 발급할 때 한 번만 보여 주고 다시
//    볼 수 없다 — 즉 사람이 손으로 옮겨 적을 방법이 없다. 브라우저 안에만 남아 있다.
//    그래서 앱이 직접 집어 쓴다. 안 그러면 '새로 발급' 이 유일한 길이 된다.
const 앱이름 = { dailybook: '데일리북', dailyenglish: '데일리영어', dailypill: '데일리약', dailyhealth: '데일리헬스' };

function 형제토큰() {
  const 것들 = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k === KEY || !/^daily[a-z0-9]*\.token$/.test(k)) continue;
      const v = localStorage.getItem(k);
      const 이름 = k.replace(/\.token$/, '');
      if (v) 것들.push({ 키: k, 값: v, 앱: 앱이름[이름] ?? 이름 });
    }
  } catch {}
  // 데일리약은 Contents 만 쥐고 Actions 가 없다 — 여기선 못 쓴다. 뒤로 미룬다.
  return 것들.sort((a, b) => (a.키 === 'dailypill.token') - (b.키 === 'dailypill.token'));
}

/** 형제 토큰을 하나씩 시험해 본다. 되는 걸 찾으면 우리 키로도 저장하고 true. */
async function 물려받기() {
  const 형제 = 형제토큰();
  if (!형제.length) return false;
  view.innerHTML = `<p class="skel">다른 데일리 앱의 토큰을 시험해 보는 중<span class="dots"></span></p>`;
  for (const f of 형제) {
    token = f.값;
    try {
      await 읽기('data/next.json');
      localStorage.setItem(KEY, token);
      물려받음 = f.앱;
      return true;
    } catch (e) {
      token = '';
      // 토큰 문제(401·403·404)는 '이 토큰은 여기를 못 본다' 는 뜻이라 다음 걸 시험한다.
      // 네트워크가 끊긴 것이라면 남은 것도 다 실패할 테니 여기서 접는다.
      if (!e.토큰문제) return false;
    }
  }
  return false;
}

// ── 토큰 설정 화면 ──────────────────────────────────────
function 토큰화면(안내 = '') {
  gear.hidden = true;
  const 형제 = 형제토큰();
  view.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 6px; font-size:19px">처음 한 번만 설정</h2>
      <p class="sub" style="margin:0 0 18px">${안내 || '이 버튼이 GitHub에 발송을 시킬 수 있도록, 권한 토큰을 한 번 넣어 주세요.<br>토큰은 이 기기 안에만 저장되고 어디에도 전송되지 않습니다.'}</p>
      ${형제.length ? `
      <p class="sub" style="margin:0 0 18px; padding:12px 14px; background:var(--bg); border-radius:11px">
        <b>새로 발급하지 않아도 됩니다.</b> 이 기기에 ${형제.map(f => `<b>${esc(f.앱)}</b>`).join(' · ')} 토큰이 있습니다.
        그 토큰의 <b>Repository access</b> 에 <code>daily-cert</code> 를 더하고 (권한은 이미 같습니다)
        이 페이지를 새로고침하면 알아서 집어 씁니다 — 토큰 문자열은 바뀌지 않습니다.<br>
        <a href="https://github.com/settings/personal-access-tokens" target="_blank" rel="noopener">→ 가진 토큰 고치러 가기</a>
      </p>` : ''}
      <label for="tk">GitHub 토큰${형제.length ? ' (새로 만들려면)' : ''}</label>
      <input id="tk" type="password" placeholder="github_pat_… 붙여넣기" autocomplete="off" spellcheck="false">
      <p class="status" id="st"></p>
      <button class="go" id="save" style="margin-top:12px">저장하고 시작</button>
      <ol>
        <li>Repository access → <b>Only select repositories</b> → <code>daily-cert</code></li>
        <li>Permissions → <b>Actions</b> = Read and write, <b>Contents</b> = Read-only</li>
      </ol>
      <p class="sub" style="margin-top:16px">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">→ 토큰 새로 발급하러 가기</a>
      </p>
    </div>`;
  $('#tk').focus();
  $('#save').onclick = async () => {
    const v = $('#tk').value.trim();
    if (!v) return;
    const btn = $('#save'), st = $('#st');
    btn.disabled = true; st.className = 'status'; st.innerHTML = '확인하는 중<span class="dots"></span>';
    token = v;
    try {
      await 읽기('data/next.json');
      localStorage.setItem(KEY, token);
      본화면();
    } catch (e) {
      token = '';
      st.className = 'status bad'; st.textContent = e.message;
      btn.disabled = false;
    }
  };
}

// ── 본 화면 ────────────────────────────────────────────
/** 지금 화면에 띄울 후보. '자동'이면 오늘 1등을 미리 보여 준다 (누를 때 다시 고른다). */
const 보이는후보 = () =>
  (고른주제 === 자동 ? 예고.후보[0] : 예고.후보.find(c => c.주제어 === 고른주제)) ?? 예고.후보[0];

function 그리기() {
  const c = 보이는후보();
  const 마지막 = 예고.lastSentDate;
  const 쉰날 = 마지막 ? 며칠전(마지막) : null;
  const 쉼 = 마지막 === null ? '아직 시작 전'
    // 음수는 폰 시계가 서버보다 뒤처진 경우다 (자정 직후 발송). 0과 같이 다룬다.
    : 쉰날 <= 0 ? (예고.오늘보냄 > 0 ? `오늘 ${예고.오늘보냄}번 보냄` : '방금 보냄')
    : 쉰날 === 1 ? '어제 보냄'
    : `${쉰날}일 쉬는 중`;

  view.innerHTML = `
    <div class="picker">
      ${[자동, ...예고.후보.map(x => x.주제어)].map(k => `
        <button class="chip" data-k="${esc(k)}" aria-pressed="${k === 고른주제}">${esc(k)}</button>`).join('')}
    </div>
    <div class="card">
      ${c.근거없음
        ? '<span class="badge flat">오늘은 걸린 주제가 없습니다</span>'
        : `<span class="badge">오늘 뉴스에 ${c.실시간 + c.헤드라인}번</span>`}
      ${고른주제 === 자동 ? '<span class="auto">누를 때 다시 고릅니다</span>' : ''}
      <h1 class="topic">${esc(c.주제어)}</h1>
      <p class="count">등록된 민간자격 <b>${c.건수.toLocaleString()}건</b> 중 ${예고.보낼자격수}개</p>
      ${근거(c)}
      ${맛보기(c)}
    </div>
    <button class="go" id="go">자격증 ${예고.보낼자격수}개 보내기</button>
    <p class="status" id="st"></p>
    ${기록()}
    <footer>
      ${esc(쉼)} · 누적 ${예고.회차}회 · 남은 주제 ${예고.남은주제}개<br>
      등록부 ${예고.자격수.toLocaleString()}건 · 사전 ${예고.사전만든날.slice(0, 10)} 기준
      ${물려받음 ? `<br>${esc(물려받음)} 앱의 토큰을 물려받았습니다` : ''}
    </footer>`;

  view.querySelectorAll('.chip').forEach(b => { b.onclick = () => { 고른주제 = b.dataset.k; 그리기(); }; });
  $('#go').onclick = 보내기;
  기록연결();
}

/** 왜 이 주제인가. 근거 없이 주제만 던지면 다음부터 안 믿는다. */
function 근거(c) {
  if (c.근거없음 || !c.근거?.length) {
    return `<div class="why"><p>사전의 어느 주제어도 오늘 뉴스에 눈에 띄게 오르지 않았습니다.
      등록이 많은 쪽으로 골랐습니다.</p></div>`;
  }
  return `<div class="why">${c.근거.slice(0, 3).map(g =>
    `<p><span class="src">${esc(g.곳)}</span>${esc(g.글)}</p>`).join('')}</div>`;
}

function 맛보기(c) {
  if (!c.미리보기?.length) return '';
  return `<p class="peek">예를 들면 ${c.미리보기.map(n => `<b>${esc(n)}</b>`).join(' · ')}</p>`;
}

// ── 보낸 기록 ──────────────────────────────────────────
// data/progress.json 의 history 를 그대로 쓴다. 따로 저장하는 게 없다 —
// 보낸 주제는 이미 발송이 남긴 기록이고, 앱이 그걸 또 적으면 같은 사실이 두 벌이 된다.
function 기록() {
  const hs = [...(진도?.history ?? [])].reverse();
  if (!hs.length) return '';
  return `
    <div class="card">
      <div class="log-head">
        <h2>보낸 주제</h2>
        <span>${hs.length}개 · 다시 안 나옵니다</span>
      </div>
      ${hs.slice(0, 30).map((h, i) => `
        <div class="row">
          <button data-i="${i}">
            <span class="t">${esc(h.주제어)}</span>
            <span class="d">${esc(h.date.slice(5))} · ${(h.건수 ?? 0).toLocaleString()}건</span>
          </button>
          ${펼친날 === i ? 펼치기(h) : ''}
        </div>`).join('')}
      ${hs.length > 30 ? `<p class="sub">…그리고 ${hs.length - 30}개 더</p>` : ''}
    </div>`;
}

function 펼치기(h) {
  const 목록 = (h.자격 ?? []).map(q =>
    `<a href="${상세(q.id)}" target="_blank" rel="noopener">${esc(q.자격명)}</a>`).join(' · ');
  return `<p class="certs">${날짜(h.date)}<br>${목록 || '기록된 자격증이 없습니다'}</p>`;
}

function 기록연결() {
  view.querySelectorAll('.row button').forEach(b => {
    b.onclick = () => { const i = +b.dataset.i; 펼친날 = 펼친날 === i ? null : i; 그리기(); };
  });
}

async function 본화면() {
  gear.hidden = false;
  view.innerHTML = '<p class="skel">불러오는 중<span class="dots"></span></p>';
  try {
    예고 = await 읽기('data/next.json');
    // 기록은 곁다리다 — 진도를 못 읽어도 보내기 화면은 떠야 한다
    진도 = await 읽기('data/progress.json').catch(() => null);
    그리기();
  } catch (e) {
    if (e.토큰문제) return 토큰화면(esc(e.message));
    view.innerHTML = `<div class="card"><p class="status bad">${esc(e.message)}</p></div>
      <button class="go" onclick="location.reload()">다시 시도</button>`;
  }
}

function 알리기(msg, kind = '') {
  const st = $('#st'); if (!st) return;
  st.className = 'status' + (kind ? ' ' + kind : '');
  st.innerHTML = msg;
}

// ── 발송 ────────────────────────────────────────────────
/** 그 시각 이후에 생긴 실행 하나. 아직 없거나 GitHub이 응답하지 않으면 null. */
async function 실행찾기(시각) {
  try {
    const { workflow_runs: runs } = await (await gh(`/actions/workflows/${WORKFLOW}/runs?per_page=5`)).json();
    return runs.find(r => new Date(r.created_at).getTime() >= 시각 - 20000) ?? null;
  } catch { return null; }
}

async function 보내기() {
  const go = $('#go');
  const 이전 = 예고.회차;
  go.disabled = true;
  go.textContent = '보내는 중…';
  알리기(`${보이는후보().주제어} 자격증을 찾는 중<span class="dots"></span>`);

  const 멈춤 = 메시지 => { go.disabled = false; go.textContent = '다시 보내기'; 알리기(메시지, 'bad'); };

  // 발송 요청은 한 번만 들어가야 한다 — 두 번 들어가면 주제도 두 개 소비된다.
  // 그런데 GitHub 은 일을 접수해 놓고 응답만 잃는 경우가 있다 (5xx). 그래서 실패했다고
  // 곧바로 다시 던지지 않고, 실행이 이미 생겼는지 확인한 뒤 없을 때만 다시 던진다.
  const 시각 = Date.now();
  for (let 시도 = 1; ; 시도++) {
    try {
      await gh(`/actions/workflows/${WORKFLOW}/dispatches`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ ref: REF, inputs: { topic: 고른주제 } }),
      });
      break;                                           // 접수됨
    } catch (e) {
      if (e.토큰문제) return 멈춤(esc(e.message));      // 권한 문제는 다시 해도 같다
      알리기('GitHub이 응답하지 않습니다. 확인하는 중<span class="dots"></span>');
      await sleep(4000);
      if (await 실행찾기(시각)) break;                  // 응답만 잃었을 뿐 접수는 됐다
      if (시도 >= 3) return 멈춤(`${esc(e.message)}<br>GitHub 쪽이 불안정합니다. 잠시 뒤 다시 눌러 주세요.`);
    }
  }
  await 지켜보기(시각, go, 이전);
}

/** 방금 띄운 실행을 찾아 끝날 때까지 지켜본다. 디스패치 직후엔 목록에 없을 수 있어 잠시 기다린다. */
async function 지켜보기(시각, go, 이전) {
  for (let i = 0; i < 75; i++) {                       // 4초 × 75 ≈ 5분
    await sleep(4000);
    const run = await 실행찾기(시각);
    if (!run) { 알리기('실행을 기다리는 중<span class="dots"></span>'); continue; }
    if (run.status !== 'completed') {
      알리기(run.status === 'queued' ? '차례를 기다리는 중<span class="dots"></span>' : '자격증을 찾는 중<span class="dots"></span>');
      continue;
    }
    if (run.conclusion === 'success') return 성공(go, 이전);
    go.textContent = '다시 보내기'; go.disabled = false;
    return 알리기(`발송에 실패했습니다 — <a href="${esc(run.html_url)}" target="_blank" rel="noopener">기록 보기</a>`, 'bad');
  }
  go.textContent = '다시 보내기'; go.disabled = false;
  알리기(`아직 끝나지 않았습니다. <a href="https://github.com/${OWNER}/${REPO}/actions" target="_blank" rel="noopener">GitHub에서 확인</a>`, 'bad');
}

async function 성공(go, 이전) {
  go.textContent = '보냈습니다 ✓';
  알리기('디스코드를 확인해 주세요.', 'ok');
  // 진도 커밋이 반영될 때까지 기다렸다가, 다음 주제로 화면을 갈아끼운다
  for (let i = 0; i < 8; i++) {
    await sleep(2500);
    try {
      const 새것 = await 읽기('data/next.json');
      if (새것.회차 > 이전) {
        예고 = 새것;
        진도 = await 읽기('data/progress.json').catch(() => 진도);  // 방금 보낸 주제가 기록에 뜨게
        고른주제 = 자동;                                 // 다음은 다시 오늘 뉴스대로
        펼친날 = null;
        그리기();
        알리기('디스코드로 보냈습니다. 더 보고 싶으면 한 번 더 누르세요.', 'ok');
        return;
      }
    } catch {}
  }
  알리기('보내긴 했습니다. 새로고침하면 다음 주제가 보입니다.', 'ok');
}

gear.onclick = () => {
  if (!confirm('저장된 토큰을 지우고 다시 넣으시겠습니까?')) return;
  localStorage.removeItem(KEY); token = '';
  토큰화면();
};

// ⚠️ 감싸는 함수가 필요하다. 이 페이지는 `<script>` 하나짜리 고전 스크립트라
//    최상위 await 이 문법 오류다 — 그러면 스크립트 전체가 안 돌고 '불러오는 중…' 에서 멈춘다.
(async () => {
  if (token) 본화면();
  else if (await 물려받기()) 본화면();
  else 토큰화면();
})();
</script>
</body>
</html>
